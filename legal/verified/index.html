  <style>
    :root { --bg:#ffffff; --ink:#111827; --ink-2:#374151; --faint:#6b7280; --btn:#111827; --btn-ink:#ffffff; }

    body {
      margin:0; background:var(--bg); color:var(--ink-2);
      font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

    p { margin:0; overflow-wrap:break-word; }
    .cta { margin:2rem 0 0; }
    .cta a {
      display:inline-block; background:var(--btn); color:var(--btn-ink);
      text-decoration:none; font-weight:600; font-size:1rem;
      padding:.8rem 1.4rem; border-radius:.55rem;
    }

<body>
  <main>
    <h1>Email verified ✅</h1>
    <p>Thanks — your email is confirmed. If you ever forget your password, we can now help you get back into your account.</p>
    <p class="cta"><a id="open" href="prolyft://callback?type=email_verified">Open ProLyft</a></p>
    <p class="close">You can close this page.</p>
  </main>
  <script>
  (function () {
    var ALLOWED = ["prolyft","prolyftdev"];
    var link = "prolyft://callback?type=email_verified";
    try {
      var want = new URLSearchParams(location.search).get('a');
      if (want && ALLOWED.indexOf(want) !== -1) {
        link = want + '://callback?type=email_verified';
        var el = document.getElementById('open');
        if (el) el.setAttribute('href', link);
      }
    } catch (e) {}
    // Auto-hop into the app, but ONLY on a phone and ONLY on success. On a
    // desktop an unknown scheme raises a browser error dialog over a page whose
    // job is already done, and after a FAILURE the hop would hide the very
    // explanation the reader has to act on.
    if (true && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      setTimeout(function () { try { location.href = link; } catch (e) {} }, 600);
    }
  })();
  </script>
