<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>See link enam ei tööta</title>
  <style>
    :root { --bg:#ffffff; --ink:#111827; --ink-2:#374151; --faint:#6b7280; --btn:#111827; --btn-ink:#ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0b0d11; --ink:#f3f4f6; --ink-2:#d1d5db; --faint:#9ca3af; --btn:#f3f4f6; --btn-ink:#0b0d11; }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin:0; background:var(--bg); color:var(--ink-2);
      font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size:17px; line-height:1.65; -webkit-font-smoothing:antialiased;
    }
    main { max-width:34rem; margin:0 auto; padding:3.5rem 1.25rem 4rem; }
    h1 { color:var(--ink); font-size:1.5rem; line-height:1.3; margin:0 0 .75rem; }
    p { margin:0; overflow-wrap:break-word; }
    .cta { margin:2rem 0 0; }
    .cta a {
      display:inline-block; background:var(--btn); color:var(--btn-ink);
      text-decoration:none; font-weight:600; font-size:1rem;
      padding:.8rem 1.4rem; border-radius:.55rem;
    }
    .close { margin-top:2rem; color:var(--faint); font-size:.8rem; }
  </style>
</head>
<body>
  <main>
    <h1>See link enam ei tööta</h1>
    <p>Link võis aeguda või olla juba kasutatud. Ava ProLyft, mine jaotisse Profiil → Seaded ja vajuta „Saada kinnituskiri uuesti“. Seni ei ole midagi lukus — konto töötab mõlemal juhul.</p>
    <p class="cta"><a id="open" href="prolyft://callback?type=email_verified">Ava ProLyft</a></p>
    <p class="close">Selle lehe võid sulgeda.</p>
  </main>
  <script>
  (function () {
    var ALLOWED = ["prolyft","prolyftdev"];
    var link = "prolyft://callback?type=email_verified";
    try {
      var want = new URLSearchParams(location.search).get('a');
      if (want && ALLOWED.indexOf(want) !== -1) {
        link = want + '://callback?type=email_verified';
        var el = document.getElementById('open');
        if (el) el.setAttribute('href', link);
      }
    } catch (e) {}
    // Auto-hop into the app, but ONLY on a phone and ONLY on success. On a
    // desktop an unknown scheme raises a browser error dialog over a page whose
    // job is already done, and after a FAILURE the hop would hide the very
    // explanation the reader has to act on.
    if (false && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      setTimeout(function () { try { location.href = link; } catch (e) {} }, 600);
    }
  })();
  </script>
</body>
</html>
